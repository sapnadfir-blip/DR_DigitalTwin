<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: #1E3A5F; }
    .subtitle { font-size: 12px; fill: #666; }
    .layer-label { font-size: 14px; font-weight: 600; fill: #fff; }
    .box-title { font-size: 13px; font-weight: 600; fill: #1E3A5F; }
    .box-sub { font-size: 11px; fill: #555; }
    .small { font-size: 10px; fill: #888; }
    .metric { font-size: 11px; font-weight: 500; fill: #2E86AB; }
    .bm-text { font-size: 10px; font-weight: 600; fill: #0F6E56; }
    .arr { stroke: #888; stroke-width: 1.5; fill: none; }
    .dash { stroke: #aaa; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2E86AB"/><stop offset="100%" stop-color="#1E6E8E"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7B5EA7"/><stop offset="100%" stop-color="#6A4E96"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#D85A30"/><stop offset="100%" stop-color="#C04828"/></linearGradient>
  </defs>

  <!-- Title -->
  <text class="title" x="450" y="30" text-anchor="middle">Digital Twin for Diabetic Retinopathy — Complete Architecture</text>
  <text class="subtitle" x="450" y="48" text-anchor="middle">OLIVES Dataset (9,396 OCT scans, 87 patients) → 3-Layer Pipeline → Interactive Dashboards</text>

  <!-- ═══ INPUT ═══ -->
  <rect x="330" y="65" width="240" height="42" rx="8" fill="#F0F4F8" stroke="#B0BEC5" stroke-width="1"/>
  <text class="box-title" x="450" y="84" text-anchor="middle">OLIVES Dataset</text>
  <text class="box-sub" x="450" y="98" text-anchor="middle">9,396 OCT scans · 87 patients · 6 biomarkers</text>

  <!-- Arrow -->
  <line x1="450" y1="107" x2="450" y2="130" class="arr" marker-end="url(#ah)"/>

  <!-- ═══ LAYER 1 ═══ -->
  <rect x="50" y="132" width="800" height="175" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
  <rect x="50" y="132" width="800" height="30" rx="12" fill="url(#g1)"/>
  <rect x="50" y="150" width="800" height="12" fill="url(#g1)"/>
  <text class="layer-label" x="450" y="152" text-anchor="middle">LAYER 1 — BIOMARKER DETECTION</text>

  <!-- ResNet-18 -->
  <rect x="80" y="175" width="130" height="50" rx="8" fill="#fff" stroke="#85B7EB" stroke-width="1"/>
  <text class="box-title" x="145" y="196" text-anchor="middle">ResNet-18</text>
  <text class="box-sub" x="145" y="212" text-anchor="middle">CNN backbone</text>

  <line x1="210" y1="200" x2="240" y2="200" class="arr" marker-end="url(#ah)"/>

  <!-- NPMI Graph -->
  <rect x="242" y="175" width="130" height="50" rx="8" fill="#fff" stroke="#AFA9EC" stroke-width="1"/>
  <text class="box-title" x="307" y="196" text-anchor="middle">NPMI Graph</text>
  <text class="box-sub" x="307" y="212" text-anchor="middle">Co-occurrence matrix</text>

  <line x1="372" y1="200" x2="402" y2="200" class="arr" marker-end="url(#ah)"/>

  <!-- GCN (winner) -->
  <rect x="404" y="175" width="130" height="50" rx="8" fill="#E8F5E9" stroke="#5DCAA5" stroke-width="1.5"/>
  <text class="box-title" x="469" y="196" text-anchor="middle">GCN ★</text>
  <text class="box-sub" x="469" y="212" text-anchor="middle">Best model (seed 2024)</text>

  <line x1="534" y1="200" x2="564" y2="200" class="arr" marker-end="url(#ah)"/>

  <!-- Output -->
  <rect x="566" y="175" width="130" height="50" rx="8" fill="#fff" stroke="#5DCAA5" stroke-width="1"/>
  <text class="box-title" x="631" y="196" text-anchor="middle">6 Probabilities</text>
  <text class="box-sub" x="631" y="212" text-anchor="middle">Per biomarker (0–1)</text>

  <!-- Other models -->
  <rect x="725" y="175" width="105" height="50" rx="8" fill="#F0F4F8" stroke="#B0BEC5" stroke-width="0.8"/>
  <text class="box-sub" x="777" y="193" text-anchor="middle">Also trained:</text>
  <text class="small" x="777" y="206" text-anchor="middle">CNN, Signed GCN,</text>
  <text class="small" x="777" y="218" text-anchor="middle">Prior-GAT</text>

  <!-- Biomarker pills -->
  <rect x="110" y="240" width="60" height="22" rx="11" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/>
  <text class="bm-text" x="140" y="255" text-anchor="middle">IRHRF</text>
  <rect x="180" y="240" width="55" height="22" rx="11" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/>
  <text class="bm-text" x="207" y="255" text-anchor="middle">PAVF</text>
  <rect x="245" y="240" width="55" height="22" rx="11" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/>
  <text class="bm-text" x="272" y="255" text-anchor="middle">FAVF</text>
  <rect x="310" y="240" width="45" height="22" rx="11" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/>
  <text class="bm-text" x="332" y="255" text-anchor="middle">IRF</text>
  <rect x="365" y="240" width="65" height="22" rx="11" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/>
  <text class="bm-text" x="397" y="255" text-anchor="middle">DRT/ME</text>
  <rect x="440" y="240" width="42" height="22" rx="11" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.8"/>
  <text class="bm-text" x="461" y="255" text-anchor="middle">VD</text>

  <!-- Metrics -->
  <text class="metric" x="580" y="255" text-anchor="start">F1: 0.8057 · AUROC: 0.8981 · 12 models trained</text>

  <!-- Shared NPMI line -->
  <text class="small" x="450" y="280" text-anchor="middle">↕ NPMI co-occurrence graph (shared structural prior) ↕</text>

  <!-- Arrow to Layer 2 -->
  <line x1="450" y1="307" x2="450" y2="335" class="arr" marker-end="url(#ah)"/>

  <!-- ═══ LAYER 2 ═══ -->
  <rect x="50" y="337" width="800" height="125" rx="12" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1"/>
  <rect x="50" y="337" width="800" height="30" rx="12" fill="url(#g2)"/>
  <rect x="50" y="355" width="800" height="12" fill="url(#g2)"/>
  <text class="layer-label" x="450" y="357" text-anchor="middle">LAYER 2 — DISEASE PROGRESSION MODELING</text>

  <!-- Graph-LSTM -->
  <rect x="80" y="380" width="150" height="50" rx="8" fill="#fff" stroke="#AFA9EC" stroke-width="1"/>
  <text class="box-title" x="155" y="401" text-anchor="middle">Graph-LSTM</text>
  <text class="box-sub" x="155" y="417" text-anchor="middle">NPMI-weighted attention</text>

  <line x1="230" y1="405" x2="270" y2="405" class="arr" marker-end="url(#ah)"/>

  <!-- Auto-regressive -->
  <rect x="272" y="380" width="170" height="50" rx="8" fill="#fff" stroke="#AFA9EC" stroke-width="1"/>
  <text class="box-title" x="357" y="401" text-anchor="middle">Auto-regressive rollout</text>
  <text class="box-sub" x="357" y="417" text-anchor="middle">Feed prediction → next step</text>

  <line x1="442" y1="405" x2="482" y2="405" class="arr" marker-end="url(#ah)"/>

  <!-- Trajectories -->
  <rect x="484" y="380" width="150" height="50" rx="8" fill="#fff" stroke="#5DCAA5" stroke-width="1"/>
  <text class="box-title" x="559" y="401" text-anchor="middle">Biomarker trajectories</text>
  <text class="box-sub" x="559" y="417" text-anchor="middle">6 future visits predicted</text>

  <!-- Severity -->
  <rect x="660" y="380" width="170" height="50" rx="8" fill="#E8F5E9" stroke="#5DCAA5" stroke-width="1"/>
  <text class="box-title" x="745" y="401" text-anchor="middle">Severity score</text>
  <text class="box-sub" x="745" y="417" text-anchor="middle">Mean of 6 probs (0–1)</text>

  <line x1="634" y1="405" x2="658" y2="405" class="arr" marker-end="url(#ah)"/>

  <text class="metric" x="450" y="448" text-anchor="middle">MAE: 0.4741 · RMSE: 0.4898 · Severity = mean(all 6 biomarker probs)</text>

  <!-- Arrow to Layer 3 -->
  <line x1="450" y1="462" x2="450" y2="490" class="arr" marker-end="url(#ah)"/>

  <!-- ═══ CAUSAL ANALYSIS (side) ═══ -->
  <rect x="680" y="475" width="160" height="50" rx="8" fill="#FBEAF0" stroke="#ED93B1" stroke-width="1"/>
  <text class="box-title" x="760" y="496" text-anchor="middle">Granger Causality</text>
  <text class="box-sub" x="760" y="511" text-anchor="middle">19 edges · 15 chains · p&lt;0.05</text>
  <line x1="634" y1="430" x2="760" y2="473" class="dash"/>

  <!-- ═══ LAYER 3 ═══ -->
  <rect x="50" y="492" width="610" height="125" rx="12" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
  <rect x="50" y="492" width="610" height="30" rx="12" fill="url(#g3)"/>
  <rect x="50" y="510" width="610" height="12" fill="url(#g3)"/>
  <text class="layer-label" x="355" y="512" text-anchor="middle">LAYER 3 — TREATMENT SIMULATION &amp; VIRTUAL DRUG TESTING</text>

  <!-- Treatment boxes -->
  <rect x="80" y="535" width="100" height="40" rx="6" fill="#FFF3E0" stroke="#EF9F27" stroke-width="1"/>
  <text class="box-title" x="130" y="553" text-anchor="middle">Anti-VEGF</text>
  <text class="small" x="130" y="566" text-anchor="middle">→ IRF, IRHRF</text>

  <rect x="195" y="535" width="90" height="40" rx="6" fill="#FFF3E0" stroke="#EF9F27" stroke-width="1"/>
  <text class="box-title" x="240" y="553" text-anchor="middle">Steroid</text>
  <text class="small" x="240" y="566" text-anchor="middle">→ DRT/ME</text>

  <rect x="300" y="535" width="80" height="40" rx="6" fill="#FFF3E0" stroke="#EF9F27" stroke-width="1"/>
  <text class="box-title" x="340" y="553" text-anchor="middle">Laser</text>
  <text class="small" x="340" y="566" text-anchor="middle">→ VD, PAVF</text>

  <rect x="395" y="535" width="105" height="40" rx="6" fill="#F0F4F8" stroke="#B0BEC5" stroke-width="1"/>
  <text class="box-title" x="447" y="553" text-anchor="middle">Observation</text>
  <text class="small" x="447" y="566" text-anchor="middle">Baseline</text>

  <!-- Monte Carlo -->
  <rect x="520" y="535" width="120" height="40" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1"/>
  <text class="box-title" x="580" y="553" text-anchor="middle">Monte Carlo</text>
  <text class="small" x="580" y="566" text-anchor="middle">50 runs → 95% CI</text>

  <text class="metric" x="355" y="600" text-anchor="middle">Compare final severity across treatments → recommend lowest</text>

  <!-- Arrow down to outputs -->
  <line x1="355" y1="617" x2="355" y2="645" class="arr" marker-end="url(#ah)"/>

  <!-- ═══ OUTPUTS ═══ -->
  <!-- Streamlit -->
  <rect x="80" y="647" width="250" height="60" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1.2"/>
  <text class="box-title" x="205" y="668" text-anchor="middle">Streamlit Dashboard</text>
  <text class="box-sub" x="205" y="684" text-anchor="middle">5 tabs · patient-level clinical tool</text>
  <text class="small" x="205" y="698" text-anchor="middle">localhost:8501</text>

  <!-- Grafana -->
  <rect x="365" y="647" width="250" height="60" rx="10" fill="#FAECE7" stroke="#F0997B" stroke-width="1.2"/>
  <text class="box-title" x="490" y="668" text-anchor="middle">Grafana Dashboard</text>
  <text class="box-sub" x="490" y="684" text-anchor="middle">10 panels · pipeline monitoring</text>
  <text class="small" x="490" y="698" text-anchor="middle">localhost:3000 via metrics API :9100</text>

  <!-- Visualizations -->
  <rect x="650" y="647" width="180" height="60" rx="10" fill="#E8F5E9" stroke="#5DCAA5" stroke-width="1.2"/>
  <text class="box-title" x="740" y="668" text-anchor="middle">8 Visualizations</text>
  <text class="box-sub" x="740" y="684" text-anchor="middle">Publication-quality PNGs</text>
  <text class="small" x="740" y="698" text-anchor="middle">outputs/visualizations/</text>

  <line x1="490" y1="617" x2="490" y2="645" class="arr" marker-end="url(#ah)"/>
  <line x1="740" y1="525" x2="740" y2="645" class="arr" marker-end="url(#ah)"/>
</svg>